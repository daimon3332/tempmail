services:
  tempmail:
    build: .
    image: tempmail:latest
    container_name: tempmail
    restart: unless-stopped
    env_file: .env
    ports:
      - "25:25"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./backups:/backups:ro
      - ./.env:/config/.env
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
